services:
  mysql:
    image: mysql:8.0
    container_name: climax_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: climax_db
      MYSQL_USER: climax_user
      MYSQL_PASSWORD: climax_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - climax_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: climax_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://climax_user:climax_password@mysql:3306/climax_db"
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - climax_network
    volumes:
      - ./src/backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: climax_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - climax_network

  nginx:
    image: nginx:alpine
    container_name: climax_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - climax_network

volumes:
  mysql_data:
    driver: local

networks:
  climax_network:
    driver: bridge
